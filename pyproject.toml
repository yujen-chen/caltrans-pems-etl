[project]
name = "caltrans-pems-etl"
version = "0.1.0"
description = "CalTrans PeMS data extraction and processing tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mechanize>=0.4.9",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "beautifulsoup4>=4.9.0",
    "lxml>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pems"]