[project]
name = "caltrans-pems-etl"
version = "0.1.0"
description = "CalTrans PeMS data extraction and processing tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mechanize>=0.4.9",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "beautifulsoup4>=4.9.0",
    "lxml>=4.6.0",
    "python-dotenv>=0.19.0",
    "holidays>=0.34",
    "pyarrow>=14.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "streamlit>=1.30.0",
    "plotly>=6.0.0",
    "boto3>=1.34.10",
    "tenacity>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9",
    "ipykernel>=6.0.0",
    "nbformat>=4.2.0",
]

[project.scripts]
monthly-download = "scripts.monthly_download:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pems", "scripts", "config"]

[tool.setuptools]
package-dir = {"" = "src"} 
